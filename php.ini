# Active l'enregistrement des erreurs PHP dans un fichier de journal
log_errors = On
# Fichier où PHP écrit ses erreurs et les messages de error_log() # Il est dans /var/log, hors du dossier du site pour ne pas être accessible depuis le navigateur
error_log = /var/log/apache2/php_errors.log

# N'affiche pas les erreurs à l'écran : un visiteur ne doit pas voir les chemins des fichiers ou les détails techniques
display_errors = Off
# Même chose pour les erreurs qui se produisent au démarrage de PHP
display_startup_errors = Off

# Niveau des erreurs enregistrées E_ALL = toutes (erreurs, avertissements, notices, dépréciations)
error_reporting = E_ALL

# Évite de remplir le journal avec la même erreur répétée On = une erreur identique répétée n'est enregistrée qu'une fois
ignore_repeated_errors = On
# Off = une erreur n'est considérée comme répétée que si elle vient du même fichier et de la même ligne
ignore_repeated_source = Off

# Longueur maximale en octets d'un message d'erreur enregistré (0 = pas de limite)
log_errors_max_len = 1024
