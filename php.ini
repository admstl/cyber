# Active l'enregistrement des messages d'erreur dans le journal du serveur ou dans un fichier dédié, et définit le chemin de ce fichier de log
log_errors = On
error_log = /var/log/apache2/php_errors.log


# Cette directive détermine si les erreurs doivent être affichées à l'écran dans la sortie, ou si elles doivent être cachées à l'utilisateur.
display_errors = Off
display_startup_errors = Off


# Définit le niveau de rapport des erreurs PHP (E_ALL rapporte toutes les erreurs, avertissements et notices)
error_reporting = E_ALL


# Ignore les messages d'erreur répétés lorsqu'ils proviennent du même fichier et de la même ligne (On), tout en continuant de les ignorer même s'ils proviennent de sources différentes (Off = ignore uniquement si même fichier et même ligne)
ignore_repeated_errors = On
ignore_repeated_source = Off


# Définit la taille maximale (en octets) d'une erreur enregistrée dans le fichier de log (1024 octets par défaut ; 0 désactive la limite)
log_errors_max_len = 1024